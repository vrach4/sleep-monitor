name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fsSL --max-time 60 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          rm cmdline-tools.zip
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Wake up Render server
        run: curl -fsSL --max-time 60 --retry 5 --retry-delay 10 https://sleep-monitor-9m56.onrender.com/manifest.json > /dev/null

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android.keystore

      - name: Create TWA manifest
        run: |
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.vrach4.sleepmonitor",
            "host": "sleep-monitor-9m56.onrender.com",
            "name": "Sleep Tracker",
            "launcherName": "Сон",
            "display": "standalone",
            "themeColor": "#1B110C",
            "themeColorDark": "#000000",
            "navigationColor": "#1B110C",
            "navigationColorDark": "#000000",
            "navigationDividerColor": "#5C3A26",
            "navigationDividerColorDark": "#000000",
            "backgroundColor": "#1B110C",
            "enableNotifications": false,
            "startUrl": "/",
            "iconUrl": "https://sleep-monitor-9m56.onrender.com/icon-512.png",
            "maskableIconUrl": "https://sleep-monitor-9m56.onrender.com/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://sleep-monitor-9m56.onrender.com/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://sleep-monitor-9m56.onrender.com/",
            "minSdkVersion": 21,
            "orientation": "portrait",
            "fingerprints": []
          }
          EOF

      - name: Configure and Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$HOME/android-sdk"
          }
          EOF
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleep-tracker-apk
          path: ./app-release-signed.apk
          if-no-files-found: error
